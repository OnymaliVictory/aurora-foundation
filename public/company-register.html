<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Create your company page · Aurora Estates</title>
<meta name="description" content="Create a branded real estate company page on Aurora Estates."><script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/aurora-app.css" id="aurora-app-css"><link rel="stylesheet" href="css/aurora-shared.css"><link rel="stylesheet" href="css/estates.css"><script src="js/theme-init.js"></script></head>
<body data-active="account"><canvas id="aurora-canvas" aria-hidden="true"></canvas><div id="chrome-nav"></div><main class="wrap">
<h1 class="page-title">Create your company page</h1><p class="muted">Get your own branded page, a dashboard to monitor your listings and team, and a link to share.</p>
<form id="f" class="glass-card pad stack" style="max-width:640px"><input class="form-input" name="name" placeholder="Company name" required minlength="2" maxlength="80">
<label class="muted">Your page link<div class="row"><span>…/c/</span><input class="form-input grow" name="slug" placeholder="yourcompany" required pattern="[a-z0-9-]{3,30}" aria-label="Page link name"></div></label><div id="slugmsg" class="muted" role="status"></div>
<input class="form-input" name="tagline" placeholder="Tagline, e.g. Trusted homes in Port Harcourt" maxlength="140">
<div class="filters"><input class="form-input" name="phone" placeholder="Phone"><input class="form-input" name="whatsapp" placeholder="WhatsApp (234…)"><input class="form-input" name="email" type="email" placeholder="Business email"><input class="form-input" name="state" placeholder="State"></div>
<textarea class="form-input" name="about" rows="4" maxlength="3000" placeholder="About your company"></textarea><button class="btn-primary">Create company page</button><p id="msg" class="muted" role="alert"></p></form>
<form id="j" class="glass-card pad stack" style="max-width:640px;margin-top:16px"><b>Joining a company already on Aurora?</b><div class="row"><input class="form-input grow" name="code" placeholder="Invite code from your company admin" required><button class="btn-secondary">Join</button></div></form>
</main><div id="chrome-footer"></div><div id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/app.js"></script><script src="js/aurora-bg.js"></script><script src="js/company-register.js"></script>
</body></html>
