<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search properties · Aurora Estates</title>
<meta name="description" content="Filter by location, price, bedrooms and verified agents."><script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/aurora-app.css" id="aurora-app-css"><link rel="stylesheet" href="css/aurora-shared.css"><link rel="stylesheet" href="css/estates.css"><script src="js/theme-init.js"></script></head>
<body data-active="search"><canvas id="aurora-canvas" aria-hidden="true"></canvas><div id="chrome-nav"></div><main class="wrap">
<h1 class="page-title">Search properties</h1>
<form id="f" class="filters"><input class="form-input" name="q" placeholder="Area, landmark, keyword" aria-label="Keyword">
<select class="form-input" name="purpose" aria-label="Purpose"><option value="">Any purpose</option></select><select class="form-input" name="ptype" aria-label="Type"><option value="">Any type</option></select>
<select class="form-input" name="state" id="state" aria-label="State"><option value="">Any state</option></select><select class="form-input" name="lga" id="lga" aria-label="Area / LGA"><option value="">Any LGA</option></select>
<input class="form-input" name="min" type="number" min="0" placeholder="Min ₦"><input class="form-input" name="max" type="number" min="0" placeholder="Max ₦">
<select class="form-input" name="beds" aria-label="Bedrooms"><option value="">Beds</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<select class="form-input" name="sort" aria-label="Sort"><option value="">Newest</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option></select>
<label class="row"><input type="checkbox" name="furnished" value="1"> Furnished</label><label class="row"><input type="checkbox" name="verified" value="1"> Verified only</label>
<button class="btn-primary">Apply</button></form>
<div class="row" style="margin-bottom:12px"><button class="btn-secondary btn-sm" id="v-list" type="button">List</button><button class="btn-secondary btn-sm" id="v-map" type="button">Map</button><span id="count" class="muted"></span></div>
<div id="results" class="grid"></div><div id="map" style="height:65vh;border-radius:16px;display:none"></div><div class="row center" style="justify-content:center;margin-top:16px"><button id="prev" class="btn-secondary btn-sm">‹ Prev</button><span id="pg" class="muted"></span><button id="next" class="btn-secondary btn-sm">Next ›</button></div>
</main><div id="chrome-footer"></div><div id="toasts" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script><script src="js/supabase-client.js"></script><script src="js/app.js"></script><script src="js/aurora-bg.js"></script><script src="js/search.js"></script>
</body></html>
